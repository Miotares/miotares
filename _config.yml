# Site settings
title: "miotares"
description: "Persönliche Website von miotares. Notizblock für Gedanken, Recherchen und Kaninchenbauten, fertig oder nicht."
url: "https://miotares.com"
baseurl: ""

# SEO settings
lang: de
timezone: Europe/Berlin
future: true

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Ordner mit Unterstrich werden nicht gebaut (z.B. _vorlagen/).
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - README.md

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Buch über PCP: jede Datei in _pcp/ wird eine eigene Seite unter /pcp/...
collections:
  pcp:
    output: true
    permalink: /pcp/:name/

# Default settings
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /articles/:slug/
      author: "miotares"
      robots: "index,follow"
  - scope:
      path: ""
      type: "pcp"
    values:
      layout: "post"
      author: "miotares"
