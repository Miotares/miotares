# Site settings
title: "miotares"
tagline: "Notizblock für Gedanken, Recherchen und Kaninchenbauten"
description: "Persönliche Website von miotares: Texte, Recherchen und Kaninchenbauten, dazu eine Recherche über die Rapgruppe PCP und das Label Weisse Scheisse."
url: "https://miotares.com"
baseurl: ""

# SEO settings
lang: de
timezone: Europe/Berlin
future: true

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Ordner mit Unterstrich werden nicht gebaut (z.B. _vorlagen/).
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - README.md
  - AGENTS.md
  - CLAUDE.md

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Default settings
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /articles/:slug/
      dropcap: true
      author: "miotares"
      robots: "index,follow"
